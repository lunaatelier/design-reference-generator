<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Reference Generator</title>
<style>
  :root {
    --bg: #101216;
    --panel: #181b22;
    --panel-2: #20242d;
    --line: #303642;
    --text: #edf0f5;
    --muted: #9aa3b5;
    --blue: #38bdf8;
    --green: #22c55e;
    --yellow: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
  }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 22px 28px;
    border-bottom: 1px solid var(--line);
  }
  .logo {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: #243243;
    color: var(--blue);
    font-weight: 800;
  }
  .header h1 { margin: 0; font-size: 17px; }
  .version { color: var(--muted); font-size: 14px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px; }
  .layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 18px; align-items: start; }
  .panel, .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px;
  }
  .panel h2 { margin: 0 0 14px; font-size: 15px; }
  .field { display: grid; gap: 7px; margin-bottom: 14px; }
  .field label { color: var(--muted); font-size: 14px; font-weight: 700; }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 7px;
    padding: 10px 11px;
    outline: none;
  }
  .field textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
  .hint { color: var(--muted); font-size: 14px; line-height: 1.55; margin: -5px 0 14px; }
  .check-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.45;
    margin: -5px 0 14px;
  }
  .check-row input { margin-top: 2px; }
  .upload {
    position: relative;
    display: block;
    border: 1.5px dashed var(--line);
    border-radius: 8px;
    padding: 22px;
    text-align: center;
    background: var(--panel-2);
    color: var(--muted);
    cursor: pointer;
  }
  .upload.drag { border-color: var(--blue); color: var(--blue); }
  .upload strong { display: block; color: var(--text); margin-bottom: 6px; }
  .upload input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  .file-name { margin-top: 10px; color: var(--blue); font-size: 14px; word-break: break-all; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 7px;
    padding: 10px 12px;
    font-weight: 700;
  }
  .btn.primary { flex: 1; border-color: #0ea5e9; background: #0ea5e9; color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .status {
    display: none;
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 7px;
    background: #1d2a34;
    color: var(--blue);
    font-size: 14px;
  }
  .status.show { display: block; }
  .status.error { background: #331d22; color: #fca5a5; }
  .empty {
    min-height: 520px;
    display: grid;
    place-items: center;
    text-align: center;
    color: var(--muted);
  }
  .result { display: none; }
  .result.show { display: block; }
  .topline { display: flex; justify-content: space-between; gap: 12px; align-items: start; margin-bottom: 18px; }
  .export-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .title h2 { margin: 0 0 8px; font-size: 23px; }
  .title p { margin: 0; color: var(--muted); line-height: 1.6; }
  .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .tag {
    border: 1px solid #27556a;
    background: #132b35;
    color: #7dd3fc;
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 14px;
    font-weight: 700;
  }
  .grid { display: grid; gap: 14px; }
  .grid.two { grid-template-columns: 1fr 1fr; }
  .grid.three { grid-template-columns: repeat(3, 1fr); }
  .label { color: var(--muted); font-size: 14px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; }
  .list { display: grid; gap: 8px; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-2);
    border-radius: 7px;
    padding: 10px;
  }
  .row span:last-child { color: var(--muted); margin-left: auto; font-size: 14px; }
  .palette { display: grid; grid-template-columns: repeat(6, 1fr); overflow: hidden; border-radius: 7px; height: 58px; margin-bottom: 10px; }
  .swatch { position: relative; }
  .swatch small {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 3px;
    background: rgba(0,0,0,.48);
    color: #fff;
    text-align: center;
    font-size: 14px;
  }
  .mood-card { display: grid; gap: 10px; }
  .mood-card.selected { border-color: var(--blue); box-shadow: 0 0 0 1px rgba(56,189,248,.22); }
  .mood-card h3 { margin: 0; font-size: 15px; }
  .mood-card p { margin: 0; color: var(--muted); line-height: 1.55; font-size: 16px; }
  .mood-card .btn { width: max-content; padding: 8px 10px; font-size: 14px; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 24px; height: 24px; border-radius: 6px; border: 1px solid rgba(255,255,255,.16); }
  .board-summary { display: grid; gap: 10px; }
  .board-summary h3 { margin: 0; font-size: 18px; }
  .board-summary p { margin: 0; color: var(--muted); line-height: 1.55; }
  .artifact-board {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr);
    gap: 14px;
    margin-top: 4px;
  }
  .artifact-preview {
    min-height: 300px;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--panel-2);
  }
  .artifact-notes { display: grid; gap: 8px; align-content: start; }
  .artifact-note { background: var(--panel-2); border-radius: 7px; padding: 11px; color: var(--muted); line-height: 1.45; }
  .login-preview { min-height: 300px; display: grid; grid-template-columns: 1fr 330px; }
  .login-hero { padding: 28px; display: grid; align-content: end; gap: 12px; }
  .login-hero h4, .screen-preview h4, .brochure-preview h4 { margin: 0; font-size: 24px; color: #fff; }
  .login-hero p, .screen-preview p, .brochure-preview p { margin: 0; line-height: 1.45; color: rgba(255,255,255,.78); }
  .login-form { margin: 28px; padding: 22px; border-radius: 8px; background: rgba(255,255,255,.92); color: #111827; display: grid; gap: 12px; align-content: center; }
  .login-form b { font-size: 20px; }
  .form-line { height: 38px; border-radius: 7px; background: #e5e7eb; }
  .form-button { height: 40px; border-radius: 7px; }
  .screen-preview { min-height: 300px; padding: 18px; display: grid; grid-template-rows: auto 1fr; gap: 14px; }
  .screen-top { display: flex; gap: 8px; align-items: center; }
  .screen-pill { width: 76px; height: 28px; border-radius: 999px; background: rgba(255,255,255,.16); }
  .screen-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 12px; }
  .screen-map, .screen-panel, .screen-table { border-radius: 8px; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.14); }
  .screen-map { min-height: 170px; position: relative; }
  .screen-map::before, .screen-map::after { content: ""; position: absolute; border-radius: 999px; background: currentColor; width: 10px; height: 10px; }
  .screen-map::before { left: 28%; top: 36%; }
  .screen-map::after { right: 24%; bottom: 28%; }
  .screen-stack { display: grid; gap: 10px; }
  .screen-panel { min-height: 76px; }
  .screen-table { min-height: 92px; grid-column: 1 / -1; }
  .brochure-preview { min-height: 300px; display: grid; grid-template-columns: .9fr 1.1fr; }
  .brochure-cover { padding: 26px; display: grid; align-content: end; gap: 12px; }
  .brochure-spread { padding: 24px; background: rgba(255,255,255,.92); color: #111827; display: grid; gap: 12px; }
  .copy-line { height: 10px; border-radius: 999px; background: rgba(17,24,39,.18); }
  .copy-line.short { width: 62%; }
  .mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mini-block { height: 58px; border-radius: 7px; background: rgba(17,24,39,.12); }
  .refs { display: grid; gap: 10px; }
  .ref-group { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .ref-head { padding: 11px 12px; background: var(--panel-2); font-weight: 800; }
  .ref-links { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
  .ref-links a, .prompt button {
    color: var(--blue);
    background: #132b35;
    border: 1px solid #27556a;
    text-decoration: none;
    border-radius: 999px;
    padding: 7px 10px;
    font-size: 14px;
    font-weight: 700;
  }
  .images { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .image-tile { min-height: 130px; background: var(--panel-2); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  .image-tile img { width: 100%; height: 150px; object-fit: cover; display: block; }
  .image-tile a { display: block; color: var(--muted); padding: 8px; font-size: 14px; text-decoration: none; }
  .prompt { display: grid; gap: 8px; }
  .prompt-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 7px; padding: 11px; color: var(--muted); font-size: 16px; line-height: 1.45; }
  @media (max-width: 920px) {
    .layout, .grid.two, .grid.three, .images, .artifact-board, .login-preview, .screen-grid, .brochure-preview { grid-template-columns: 1fr; }
    .topline { display: grid; }
  }
</style>
</head>
<body>
<header class="header">
  <div class="logo">DR</div>
  <h1>Design Reference Generator</h1>
</header>

<main class="wrap">
  <div class="layout">
    <aside class="panel">
      <h2>입력</h2>
      <div class="field">
        <label for="provider">분석 API</label>
        <select id="provider">
          <option value="gemini">Gemini API free tier</option>
          <option value="groq">Groq free plan</option>
          <option value="manual">API 없이 샘플 구조 생성</option>
        </select>
      </div>
      <div class="field" id="modelField">
        <label for="model">모델</label>
        <input id="model" value="gemini-3.1-flash-lite">
      </div>
      <div class="field" id="keyField">
        <label for="apiKey">분석 API key</label>
        <input id="apiKey" type="password" placeholder="브라우저 세션에만 저장">
      </div>
      <label class="check-row" id="rememberAnalysisRow">
        <input type="checkbox" id="rememberAnalysisKey">
        <span>이 브라우저에 분석 API key 저장</span>
      </label>
      <p class="hint">공용 PC에서는 저장하지 마세요. 팀 배포 시에는 key 입력 방식을 서버리스 프록시로 바꾸는 것이 안전합니다.</p>

      <div class="field">
        <label for="referencePurpose">찾을 레퍼런스 목적</label>
        <select id="referencePurpose">
          <option value="auto">문서에서 자동 판단</option>
          <option value="ui-reference">UI</option>
          <option value="image-reference">이미지</option>
        </select>
      </div>

      <div class="field">
        <label for="themePreference">선호 테마</label>
        <select id="themePreference">
          <option value="both">다크/라이트 둘 다 제안</option>
          <option value="light">라이트 모드 우선</option>
          <option value="dark">다크 모드 우선</option>
          <option value="auto">문서에서 자동 판단</option>
        </select>
      </div>

      <div class="field">
        <label for="imageProvider">무드 이미지 API</label>
        <select id="imageProvider">
          <option value="none">사용 안 함</option>
          <option value="pexels">Pexels</option>
          <option value="unsplash">Unsplash</option>
        </select>
      </div>
      <div class="field" id="imageKeyField">
        <label for="imageKey">이미지 API key</label>
        <input id="imageKey" type="password" placeholder="Pexels/Unsplash API key 필요">
      </div>
      <label class="check-row" id="rememberImageRow">
        <input type="checkbox" id="rememberImageKey">
        <span>이 브라우저에 이미지 API key 저장</span>
      </label>

      <label class="upload" id="upload" for="fileInput">
        <strong>설계 문서 업로드</strong>
        <div>.md / .txt / .pdf</div>
        <input type="file" id="fileInput" accept=".md,.txt,.pdf">
        <div class="file-name" id="fileName"></div>
      </label>

      <div class="field" style="margin-top:14px;">
        <label for="pasteText">또는 설계 내용 붙여넣기</label>
        <textarea id="pasteText" placeholder="프로젝트 개요, 화면 목록, 기능 요구사항, 컬러 조건 등을 붙여넣으세요."></textarea>
      </div>

      <div class="actions">
        <button class="btn primary" id="runBtn">레퍼런스 수집안 생성</button>
        <button class="btn" id="resetBtn">초기화</button>
      </div>
      <div class="status" id="status"></div>
    </aside>

    <section>
      <div class="empty panel" id="empty">
        <div>
          <h2>설계 문서를 기준으로 레퍼런스 검색어와 무드보드를 생성합니다.</h2>
          <p>먼저 목적을 정하고, 그 목적에 맞는 레퍼런스 검색 전략을 만든 뒤 무드보드와 최종 산출물 파일을 구성합니다.</p>
        </div>
      </div>

      <div class="result" id="result">
        <div class="topline">
          <div class="title">
            <h2 id="projectTitle"></h2>
            <p id="projectDesc"></p>
            <div class="tags" id="tags"></div>
          </div>
        </div>

        <div class="grid two" style="margin-bottom:14px;">
          <div class="card">
            <div class="label">필요 산출물 구성</div>
            <div class="list" id="screenTypes"></div>
          </div>
          <div class="card">
            <div class="label">디자인 판단 기준</div>
            <div class="list" id="directionList"></div>
          </div>
        </div>

        <div class="card" style="margin-bottom:14px;">
          <div class="label">컬러 팔레트</div>
          <div class="palette" id="palette"></div>
          <div class="list" id="paletteList"></div>
        </div>

        <div class="grid three" id="moods" style="margin-bottom:14px;"></div>

        <div class="card" id="moodBoardCard" style="margin-bottom:14px;">
          <div class="label">선택 무드 기반 보드</div>
          <div class="board-summary" id="moodBoard"></div>
        </div>

        <div class="card" style="margin-bottom:14px;">
          <div class="label">플랫폼별 레퍼런스 수집</div>
          <div class="refs" id="references"></div>
        </div>

        <div class="card" id="imagesCard" style="margin-bottom:14px;">
          <div class="label">보조 이미지 후보</div>
          <div class="images" id="images"></div>
        </div>

        <div class="card" id="promptsCard" style="margin-bottom:14px;">
          <div class="label">이미지 생성 프롬프트</div>
          <div class="prompt" id="prompts"></div>
        </div>

        <div class="card">
          <div class="label">최종 결과 저장</div>
          <div class="export-actions">
            <button class="btn" id="exportMdBtn">MD 저장</button>
            <button class="btn" id="exportBtn">JSON 저장</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<script>
const state = { fileText: '', fileBase64: '', fileType: '', result: null, selectedMoodIndex: 0 };
const $ = id => document.getElementById(id);

const provider = $('provider');
const model = $('model');
const apiKey = $('apiKey');
const imageProvider = $('imageProvider');
const imageKey = $('imageKey');
const referencePurpose = $('referencePurpose');
const themePreference = $('themePreference');
const rememberAnalysisKey = $('rememberAnalysisKey');
const rememberImageKey = $('rememberImageKey');
const upload = $('upload');
const fileInput = $('fileInput');
const statusBox = $('status');

rememberAnalysisKey.checked = localStorage.getItem('drg.rememberAnalysisKey') === 'true';
rememberImageKey.checked = localStorage.getItem('drg.rememberImageKey') === 'true';
apiKey.value = readSavedKey('drg.analysisKey', rememberAnalysisKey.checked);
imageKey.value = readSavedKey('drg.imageKey', rememberImageKey.checked);
provider.value = sessionStorage.getItem('drg.provider') || 'gemini';
model.value = sessionStorage.getItem('drg.model') || 'gemini-3.1-flash-lite';
imageProvider.value = sessionStorage.getItem('drg.imageProvider') || 'none';
referencePurpose.value = normalizePurposeSelection(sessionStorage.getItem('drg.referencePurpose') || 'auto');
themePreference.value = sessionStorage.getItem('drg.themePreference') || 'both';
toggleFields();

provider.addEventListener('change', () => {
  sessionStorage.setItem('drg.provider', provider.value);
  if (provider.value === 'gemini') model.value = 'gemini-3.1-flash-lite';
  if (provider.value === 'groq') model.value = 'llama-3.3-70b-versatile';
  sessionStorage.setItem('drg.model', model.value);
  toggleFields();
});
model.addEventListener('input', () => sessionStorage.setItem('drg.model', model.value));
apiKey.addEventListener('input', () => saveKey('drg.analysisKey', apiKey.value, rememberAnalysisKey.checked));
rememberAnalysisKey.addEventListener('change', () => {
  localStorage.setItem('drg.rememberAnalysisKey', String(rememberAnalysisKey.checked));
  migrateKey('drg.analysisKey', rememberAnalysisKey.checked);
});
imageProvider.addEventListener('change', () => {
  sessionStorage.setItem('drg.imageProvider', imageProvider.value);
  toggleFields();
});
referencePurpose.addEventListener('change', () => sessionStorage.setItem('drg.referencePurpose', referencePurpose.value));
themePreference.addEventListener('change', () => sessionStorage.setItem('drg.themePreference', themePreference.value));
imageKey.addEventListener('input', () => saveKey('drg.imageKey', imageKey.value, rememberImageKey.checked));
rememberImageKey.addEventListener('change', () => {
  localStorage.setItem('drg.rememberImageKey', String(rememberImageKey.checked));
  migrateKey('drg.imageKey', rememberImageKey.checked);
});

upload.addEventListener('dragover', e => { e.preventDefault(); upload.classList.add('drag'); });
upload.addEventListener('dragleave', () => upload.classList.remove('drag'));
upload.addEventListener('drop', e => {
  e.preventDefault();
  upload.classList.remove('drag');
  if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) readFile(e.target.files[0]);
  e.target.value = '';
});

$('runBtn').addEventListener('click', run);
$('resetBtn').addEventListener('click', reset);
$('exportBtn').addEventListener('click', exportJson);
$('exportMdBtn').addEventListener('click', exportMarkdown);

function toggleFields() {
  $('keyField').style.display = provider.value === 'manual' ? 'none' : 'grid';
  $('rememberAnalysisRow').style.display = provider.value === 'manual' ? 'none' : 'flex';
  $('modelField').style.display = provider.value === 'manual' ? 'none' : 'grid';
  $('imageKeyField').style.display = imageProvider.value === 'none' ? 'none' : 'grid';
  $('rememberImageRow').style.display = imageProvider.value === 'none' ? 'none' : 'flex';
}

function readSavedKey(name, remember) {
  return (remember ? localStorage.getItem(name) : sessionStorage.getItem(name)) || '';
}

function saveKey(name, value, remember) {
  const target = remember ? localStorage : sessionStorage;
  const other = remember ? sessionStorage : localStorage;
  target.setItem(name, value);
  other.removeItem(name);
}

function migrateKey(name, remember) {
  const currentValue = name === 'drg.analysisKey' ? apiKey.value : imageKey.value;
  saveKey(name, currentValue, remember);
}

function setStatus(message, isError = false) {
  statusBox.textContent = message;
  statusBox.className = 'status show' + (isError ? ' error' : '');
}

function readFile(file) {
  $('fileName').textContent = file.name;
  const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  const reader = new FileReader();
  reader.onload = e => {
    if (isPdf) {
      state.fileType = 'pdf';
      state.fileBase64 = e.target.result.split(',')[1];
      state.fileText = '';
      setStatus('PDF를 읽었습니다. Gemini 분석 API 사용 시 텍스트 추출 없이 원본 문서로 전송됩니다.');
    } else {
      state.fileType = 'text';
      state.fileText = e.target.result;
      state.fileBase64 = '';
      setStatus('텍스트 문서를 읽었습니다.');
    }
  };
  if (isPdf) reader.readAsDataURL(file);
  else reader.readAsText(file);
}

async function run() {
  try {
    $('runBtn').disabled = true;
    setStatus('설계 문서를 분석하는 중입니다.');
    const text = $('pasteText').value.trim() || state.fileText.trim();
    if (!text && !state.fileBase64) throw new Error('설계 문서를 업로드하거나 내용을 붙여넣어 주세요.');
    if (provider.value !== 'manual' && !apiKey.value.trim()) throw new Error('분석 API key가 필요합니다.');
    if (state.fileType === 'pdf' && provider.value === 'groq') throw new Error('Groq는 이 정적 HTML에서 PDF 원문 분석을 지원하지 않습니다. PDF 내용을 텍스트로 붙여넣거나 Gemini를 사용하세요.');

    const analysis = provider.value === 'manual'
      ? createFallbackAnalysis(text)
      : await analyzeDocument(text);

    setStatus('목적별 레퍼런스 수집안과 무드보드를 구성하는 중입니다.');
    normalizeAnalysis(analysis);
    analysis.references = buildReferences(analysis);
    state.selectedMoodIndex = 0;
    analysis.selectedMood = analysis.moods[0] || null;
    analysis.moodImages = canLoadMoodImages(analysis) ? await loadMoodImages(getSelectedMoodImageKeywords(analysis)) : [];
    state.result = analysis;
    render(analysis);
    setStatus('완료되었습니다.');
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $('runBtn').disabled = false;
  }
}

async function analyzeDocument(text) {
  const prompt = buildPrompt(text);
  if (provider.value === 'gemini') return analyzeWithGemini(prompt);
  return analyzeWithGroq(prompt);
}

async function analyzeWithGemini(prompt) {
  const parts = state.fileType === 'pdf'
    ? [
        { inlineData: { mimeType: 'application/pdf', data: state.fileBase64 } },
        { text: prompt }
      ]
    : [{ text: prompt }];
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model.value)}:generateContent?key=${encodeURIComponent(apiKey.value.trim())}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts }],
      generationConfig: { responseMimeType: 'application/json', temperature: 0.35 }
    })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || 'Gemini 분석 실패');
  const raw = data.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
  try {
    return parseJson(raw);
  } catch (err) {
    return repairJsonWithGemini(raw, err.message);
  }
}

async function analyzeWithGroq(prompt) {
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey.value.trim()}`
    },
    body: JSON.stringify({
      model: model.value,
      temperature: 0.35,
      response_format: { type: 'json_object' },
      messages: [
        { role: 'system', content: 'You return strict JSON only.' },
        { role: 'user', content: prompt }
      ]
    })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || 'Groq 분석 실패');
  const raw = data.choices?.[0]?.message?.content || '';
  try {
    return parseJson(raw);
  } catch (err) {
    return repairJsonWithGroq(raw, err.message);
  }
}

function parseJson(raw) {
  const cleaned = raw.replace(/```json|```/g, '').trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if (start < 0 || end < 0) throw new Error('JSON 응답을 찾지 못했습니다.');
  const jsonText = cleaned.slice(start, end + 1);
  try {
    return JSON.parse(jsonText);
  } catch (err) {
    const position = Number(err.message.match(/position (\d+)/)?.[1] || 0);
    const preview = jsonText.slice(Math.max(0, position - 80), position + 220);
    throw new Error(`JSON 형식 오류: ${err.message}. 응답 일부: ${preview}`);
  }
}

async function repairJsonWithGemini(raw, parseError) {
  setStatus('JSON 형식이 깨져 자동으로 정리하는 중입니다.');
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model.value)}:generateContent?key=${encodeURIComponent(apiKey.value.trim())}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: buildJsonRepairPrompt(raw, parseError) }] }],
      generationConfig: { responseMimeType: 'application/json', temperature: 0 }
    })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || 'Gemini JSON 정리 실패');
  const repaired = data.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
  return parseJson(repaired);
}

async function repairJsonWithGroq(raw, parseError) {
  setStatus('JSON 형식이 깨져 자동으로 정리하는 중입니다.');
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey.value.trim()}`
    },
    body: JSON.stringify({
      model: model.value,
      temperature: 0,
      response_format: { type: 'json_object' },
      messages: [
        { role: 'system', content: 'You fix invalid JSON and return strict valid JSON only.' },
        { role: 'user', content: buildJsonRepairPrompt(raw, parseError) }
      ]
    })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || 'Groq JSON 정리 실패');
  return parseJson(data.choices?.[0]?.message?.content || '');
}

function buildJsonRepairPrompt(raw, parseError) {
  return `아래 응답은 JSON 형식이 깨졌습니다. 의미를 유지하되 유효한 JSON 객체로만 다시 출력하세요.
마크다운 코드블록, 설명, 주석은 금지합니다.
모든 key와 모든 문자열 value는 반드시 큰따옴표로 감싸세요.
배열과 객체의 trailing comma를 제거하세요.

파싱 오류:
${parseError}

깨진 응답:
${raw.slice(0, 24000)}`;
}

function normalizeAnalysis(d) {
  d.project ||= {};
  d.project.title ||= 'Untitled Project';
  d.project.description ||= '설계 문서 기반 디자인 레퍼런스 방향';
  d.project.tags ||= [];
  applySelectedPurpose(d);
  d.referencePurpose ||= inferPurpose(d.project);
  d.referencePurpose = normalizePurposeObject(d.referencePurpose, d.project);
  d.themeRecommendation ||= getDefaultThemeRecommendation();
  d.referencePlan ||= [
    `${d.referencePurpose.label}에 필요한 화면/시각 요소를 먼저 분리`,
    '플랫폼별 특성에 맞는 검색어로 레퍼런스 후보 수집',
    '선택한 레퍼런스의 공통 패턴을 팔레트, 레이아웃, 무드로 정리'
  ];
  d.screenTypes ||= [];
  d.directions ||= [];
  d.palette ||= [
    { name: 'Base', hex: '#101216', role: 'Background' },
    { name: 'Surface', hex: '#20242d', role: 'Surface' },
    { name: 'Accent', hex: '#38bdf8', role: 'Primary' },
    { name: 'Success', hex: '#22c55e', role: 'Positive' },
    { name: 'Warning', hex: '#f59e0b', role: 'Warning' }
  ];
  d.moods ||= [];
  d.referenceKeywords ||= getDefaultReferenceKeywords(d.project);
  d.platformKeywords ||= buildPlatformKeywords(d.referencePurpose.value, d.project, d.referenceKeywords);
  d.imageKeywords ||= getDefaultImageKeywords(d);
  d.moods = d.moods.map(m => ({
    ...m,
    colors: (m.colors && m.colors.length ? m.colors : d.palette.slice(0, 4).map(c => c.hex)).filter(Boolean)
  }));
  if (!d.imagePrompts || !d.imagePrompts.length) d.imagePrompts = getDefaultImagePrompts(d);
  if (!isImageGenerationPurpose(d)) d.imagePrompts = [];
  d.selectedMood ||= d.moods[0] || null;
}

function applySelectedPurpose(d) {
  if (referencePurpose.value === 'auto') return;
  const purpose = getPurposeConfig(referencePurpose.value);
  d.referencePurpose = { value: purpose.value, label: purpose.label, reason: purpose.reason };
  d.project.assetType ||= purpose.assetType;
  d.project.tags = Array.from(new Set([...(d.project.tags || []), ...purpose.tags]));
  d.referenceKeywords = getDefaultReferenceKeywords({ ...d.project, assetType: purpose.assetType });
  d.platformKeywords = buildPlatformKeywords(purpose.value, d.project, d.referenceKeywords);
  d.imageKeywords = getDefaultImageKeywords(d);
  if (isImageGenerationPurpose(d) && (!d.imagePrompts || !d.imagePrompts.length)) d.imagePrompts = getDefaultImagePrompts(d);
}

function getPurposeConfig(value) {
  value = normalizePurposeSelection(value);
  const configs = {
    'ui-reference': { value, label: 'UI', reason: '화면 구조, 컴포넌트, 인터랙션 흐름의 UI 레퍼런스가 필요합니다.', assetType: 'dashboard', tags: ['UI reference'] },
    'image-reference': { value, label: '이미지', reason: '산출물에 사용할 표지, 히어로, 삽입 비주얼의 이미지 레퍼런스가 필요합니다.', assetType: 'image', tags: ['image reference'] }
  };
  return configs[value] || configs['ui-reference'];
}

function getDefaultImageKeywords(d) {
  const purpose = getPurposeValue(d);
  const assetType = (d.project?.assetType || '').toLowerCase();
  const domain = d.project?.domain || 'digital service';
  if (purpose !== 'image-reference') return [];
  if (isDocumentAsset(assetType)) return [`${domain} technology abstract background`, `${domain} brochure cover visual`, 'digital infrastructure abstract', 'editorial cover background'];
  if (assetType.includes('login')) return [`${domain} login background`, 'secure digital service visual', 'modern technology hero image', 'trustworthy web login'];
  if (assetType.includes('landing') || assetType.includes('web')) return [`${domain} hero image`, 'website visual direction', 'modern product hero', 'digital service background'];
  return [`${domain} concept image`, 'technology abstract background', 'professional product visual', 'editorial support image'];
}

function getDefaultImagePrompts(d) {
  const purpose = getPurposeValue(d);
  const title = d.project?.title || 'digital service';
  const assetType = (d.project?.assetType || '').toLowerCase();
  if (purpose !== 'image-reference') return [];
  if (assetType.includes('login')) {
    return [
      `A polished login page hero image for ${title}, secure digital service atmosphere, clean composition, trustworthy modern visual, no text`,
      `Authentication screen background visual for ${title}, subtle technology motif, calm blue accent, professional SaaS style, no text`,
      `Modern login hero moodboard image, accessible and trustworthy public service tone, soft depth, refined product visual, no text`
    ];
  }
  if (assetType.includes('landing') || assetType.includes('web')) {
    return [
      `Website hero image for ${title}, modern digital service, clear focal point, premium product atmosphere, no text`,
      `Landing page visual direction for ${title}, professional technology mood, bright and clean composition, no text`,
      `High quality web hero background, refined brand mood, realistic digital service visual, no text`
    ];
  }
  if (isDocumentAsset(assetType)) {
    return [
      `Brochure cover image for ${title}, technology abstract background, refined editorial composition, deep blue and cyan palette, no text, no people, no handshake`,
      `Proposal document hero visual for ${title}, digital infrastructure concept, clean premium layout support image, no text, no meeting scene`,
      `Business report cover visual for ${title}, structured modern abstract data network image, polished technical brand mood, no text, no office people`
    ];
  }
  return [
    `Image reference for ${title}, modern digital service concept, clear focal point, refined brand visual, no text`,
    `Editorial support image for ${title}, professional technology mood, clean composition, no text`,
    `High quality abstract background for ${title}, premium product atmosphere, no people, no text`
  ];
}

function inferPurpose(project) {
  const assetType = (project.assetType || '').toLowerCase();
  if (assetType.includes('image') || assetType.includes('login') || isDocumentAsset(assetType)) return { value: 'image-reference', label: '이미지', reason: '산출물에 들어갈 표지, 히어로, 삽입 비주얼의 이미지 방향이 중요합니다.' };
  return { value: 'ui-reference', label: 'UI', reason: '화면 구조, 컴포넌트, 정보 흐름의 UI 레퍼런스가 필요합니다.' };
}

function normalizePurposeSelection(value) {
  const legacyImage = ['login-visual', 'brochure'];
  const legacyUi = ['dashboard-ui', 'landing-page', 'design-system'];
  if (value === 'image-reference' || legacyImage.includes(value)) return 'image-reference';
  if (value === 'ui-reference' || legacyUi.includes(value)) return 'ui-reference';
  return 'auto';
}

function normalizePurposeObject(purpose, project) {
  const inferred = inferPurpose(project || {});
  const value = normalizePurposeSelection(purpose?.value || inferred.value);
  if (value === 'auto') return inferred;
  const label = value === 'image-reference' ? '이미지' : 'UI';
  return {
    value,
    label,
    reason: purpose?.reason || (value === 'image-reference'
      ? '산출물에 들어갈 표지, 히어로, 삽입 비주얼의 이미지 방향이 중요합니다.'
      : '화면 구조, 컴포넌트, 정보 흐름의 UI 레퍼런스가 필요합니다.')
  };
}

function isDocumentAsset(assetType) {
  return /brochure|proposal|report|poster|leaflet|catalog|booklet|document/.test(assetType || '');
}

function getDefaultThemeRecommendation() {
  if (themePreference.value === 'light') return { preferred: 'light', reason: '사용자가 라이트 모드 우선을 선택했습니다.', alternatives: ['장시간 관제용 다크 모드를 보조안으로 검토'] };
  if (themePreference.value === 'dark') return { preferred: 'dark', reason: '사용자가 다크 모드 우선을 선택했습니다.', alternatives: ['일반 업무/보고용 라이트 모드 대응안 준비'] };
  if (themePreference.value === 'auto') return { preferred: 'both', reason: '문서만으로 단일 테마를 확정하기 어려워 양쪽 방향을 비교합니다.', alternatives: ['업무 환경과 사용 시간대에 따라 최종 선택'] };
  return { preferred: 'both', reason: '사용자가 다크/라이트 모두 제안을 선택했습니다.', alternatives: ['라이트는 업무 가독성, 다크는 관제/모니터링 몰입도 중심으로 비교'] };
}

function getDefaultReferenceKeywords(project) {
  const assetType = (project.assetType || '').toLowerCase();
  const domain = project.domain || 'brand';
  if (assetType.includes('brochure') || assetType.includes('proposal') || assetType.includes('report')) {
    return [
      `${domain} brochure design`,
      `${domain} corporate brochure layout`,
      `${domain} editorial grid design`,
      `${domain} brand booklet design`
    ];
  }
  if (assetType.includes('login')) {
    return [
      `${domain} login page UI`,
      `${domain} login hero image`,
      `authentication screen visual`,
      `SaaS sign in screen`
    ];
  }
  if (assetType.includes('landing')) {
    return [`${domain} landing page design`, `${domain} website hero design`, `${domain} web section layout`];
  }
  if (assetType.includes('image')) {
    return [`${domain} image direction`, `${domain} hero visual`, `${domain} editorial image`, `technology abstract background`];
  }
  if (assetType.includes('design-system')) {
    return [`${domain} design system`, `${domain} UI kit`, `component library`, `data table component`];
  }
  return [
    `${domain} dashboard UI`,
    `${domain} web app design`,
    `${project.target || 'operator'} dashboard interface`
  ];
}

function buildReferences(keywords) {
  if (!Array.isArray(keywords)) {
    const d = keywords;
    const platformKeywords = d.platformKeywords || buildPlatformKeywords(d.referencePurpose?.value, d.project, d.referenceKeywords || []);
    return buildPlatformReferenceGroups(platformKeywords);
  }
  return buildPlatformReferenceGroups({
    Dribbble: keywords,
    Behance: keywords,
    Mobbin: keywords,
    Pinterest: keywords,
    'Figma Community': keywords
  });
}

function buildPlatformKeywords(purpose, project, baseKeywords) {
  purpose = normalizePurposeSelection(purpose || inferPurpose(project).value);
  const domain = project.domain || 'service';
  const target = project.target || 'user';
  const assetType = (project.assetType || '').toLowerCase();

        Dribbble: [`${domain} web page UI`, 'SaaS website hero section', 'product website visual direction'],
        Behance: [`${domain} website case study`, 'landing page brand system', 'product storytelling website'],
        Mobbin: ['marketing website screen', 'SaaS landing page pattern', 'pricing section UI'],
        Pinterest: [`${domain} website moodboard`, 'landing page layout inspiration', 'web hero visual moodboard'],
        'Figma Community': ['landing page template', 'website design system', 'hero section components']
      };
    }
    return {
      Dribbble: [`${domain} dashboard UI`, `${domain} web app UI`, 'data visualization interface'],
      Behance: [`${domain} product UX case study`, 'enterprise web application UI', 'dashboard interface case study'],
      Mobbin: ['dashboard screen', 'admin screen', 'data table screen'],
      Pinterest: [`${domain} UI inspiration`, 'web app interface moodboard', 'dashboard layout inspiration'],
      'Figma Community': ['dashboard UI kit', 'web app template', 'component library']

  }

      Behance: [`${domain} brochure case study`, 'brand booklet visual system', 'business proposal visual design'],
      Mobbin: [],
      Pinterest: [`${domain} brochure image direction`, 'technology abstract background', 'editorial cover inspiration'],

    };
  }
  if (purpose === 'image-reference' && assetType.includes('login')) {
    return {
      Dribbble: [`${domain} login hero visual`, 'authentication background image', 'SaaS login illustration'],
      Behance: [`${domain} login visual case study`, 'authentication brand visual', 'secure service hero image'],
      Mobbin: ['login screen', 'sign in screen', 'authentication flow'],
      Pinterest: [`${domain} login image direction`, 'login background visual', 'SaaS login inspiration'],
      'Figma Community': ['login page template', 'authentication template', 'sign in screen']
    };
  }
  if (purpose === 'image-reference') {
    return {
      Dribbble: [`${domain} hero visual`, 'website image direction', 'digital service abstract image'],
      Behance: [`${domain} brand visual case study`, 'product hero image system', 'digital service visual design'],
      Mobbin: [],
      Pinterest: [`${domain} hero image inspiration`, 'technology abstract background', 'editorial image direction'],
      'Figma Community': ['hero section template', 'website visual template', 'landing page template']
    };
  }
  const byPurpose = {

      Behance: [`${domain} login page case study`, 'authentication experience design', 'brand login UI case study'],
      Mobbin: ['login screen', 'sign in screen', 'authentication flow'],
      Pinterest: [`${domain} login page moodboard`, 'login background visual', 'SaaS login inspiration'],
      'Figma Community': ['login page UI kit', 'authentication template', 'sign in component']
    },
    'dashboard-ui': {
      Dribbble: [`${domain} dashboard UI`, 'monitoring dashboard interface', 'data visualization dashboard UI'],
      Behance: [`${domain} dashboard UX case study`, 'enterprise monitoring dashboard', 'GIS dashboard interface case study'],
      Mobbin: ['dashboard screen', 'admin dashboard', 'data table screen'],
      Pinterest: [`${domain} dashboard UI inspiration`, 'control room dashboard UI', 'data visualization dashboard'],
      'Figma Community': ['dashboard UI kit', 'admin dashboard template', 'data table component']
    },
    'landing-page': {
      Dribbble: [`${domain} landing page design`, 'SaaS website hero section', 'product website visual direction'],
      Behance: [`${domain} website case study`, 'landing page brand system', 'product storytelling website'],
      Mobbin: ['marketing website screen', 'SaaS landing page pattern', 'pricing section UI'],
      Pinterest: [`${domain} website moodboard`, 'landing page layout inspiration', 'web hero visual moodboard'],
      'Figma Community': ['landing page template', 'website design system', 'hero section components']
    },
    brochure: {
      Dribbble: [`${domain} brochure visual design`, 'corporate brochure layout', 'editorial brochure design'],
      Behance: [`${domain} brochure case study`, 'brand booklet design', 'business proposal layout'],
      Mobbin: ['presentation', 'report', 'document editor'],
      Pinterest: [`${domain} brochure moodboard`, 'editorial grid brochure', 'corporate booklet inspiration'],
      'Figma Community': ['brochure template', 'proposal template', 'editorial layout template']
    },
    'design-system': {
      Dribbble: [`${domain} design system`, 'component library UI', 'dashboard components'],
      Behance: [`${domain} design system case study`, 'enterprise UI kit case study', 'component library documentation'],
      Mobbin: ['settings screen components', 'table component pattern', 'form component UI'],
      Pinterest: ['design system moodboard', 'UI component library', 'interface style guide'],
      'Figma Community': ['design system file', 'component library', 'dashboard UI kit']
    }
  };
  return byPurpose[purpose] || byPurpose['landing-page'] || buildPlatformKeywords(inferPurpose(project).value, project, baseKeywords);
}

function buildPlatformReferenceGroups(platformKeywords) {
  const make = q => encodeURIComponent(q).replace(/%20/g, '+');
  const urls = {
    Dribbble: q => `https://dribbble.com/search/${make(q)}`,
    Behance: q => `https://www.behance.net/search/projects?search=${make(q)}`,
    Mobbin: q => `https://mobbin.com/search?q=${make(q)}`,
    Pinterest: q => `https://www.pinterest.com/search/pins/?q=${make(q)}`,
    'Figma Community': q => `https://www.figma.com/community/search?resource_type=files&q=${make(q)}`
  };
  const notes = {
    Dribbble: '시각 스타일, 화면 톤, 마이크로 UI 탐색',
    Behance: '프로젝트 맥락, UX 케이스스터디, 전체 콘셉트 탐색',
    Mobbin: '실제 제품 화면 패턴, 플로우, 화면 단위 탐색',
    Pinterest: '무드보드, 시각 톤, 이미지 방향 탐색',
    'Figma Community': 'UI kit, 컴포넌트, 템플릿 탐색'
  };
  return Object.keys(urls).map(name => ({
    name,
    note: notes[name],
    items: (platformKeywords[name] || []).map(k => ({ label: k, url: urls[name](k) }))
  }));
}

function getPurposeValue(d) {
  return normalizePurposeSelection(d.referencePurpose?.value || inferPurpose(d.project || {}).value);
}

function isUiReferencePurpose(d) {
  return getPurposeValue(d) === 'ui-reference';
}

function isImageGenerationPurpose(d) {
  return getPurposeValue(d) === 'image-reference';
}

function shouldUseMoodImages(d) {
  return imageProvider.value !== 'none' && isImageGenerationPurpose(d);
}

function canLoadMoodImages(d) {
  return shouldUseMoodImages(d) && imageKey.value.trim();
}

function getSelectedMood(d) {
  return d.moods?.[state.selectedMoodIndex] || d.moods?.[0] || null;
}

function getSelectedMoodImageKeywords(d) {
  const mood = getSelectedMood(d);
  const moodKeywords = mood?.keywords || [];
  const keywords = [...moodKeywords, ...(d.imageKeywords || []), ...(d.referenceKeywords || [])];
  if (isDocumentAsset((d.project?.assetType || '').toLowerCase())) {
    const domain = d.project?.domain || 'technology';
    return [
      `${domain} technology abstract background`,
      `${domain} brochure cover visual`,
      'digital infrastructure abstract',
      'editorial cover background',
      ...keywords
    ].filter(k => !/(handshake|meeting|office people|business people|corporate photography)/i.test(k)).slice(0, 5);
  }
  return keywords.slice(0, 5);
}

async function loadMoodImages(keywords) {
  if (imageProvider.value === 'none' || !imageKey.value.trim()) return [];
  const query = keywords.slice(0, 3).join(' ');
  try {
    if (imageProvider.value === 'pexels') {
      const res = await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=8&orientation=landscape`, {
        headers: { Authorization: imageKey.value.trim() }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Pexels 이미지 로드 실패');
      return (data.photos || []).map(p => ({
        src: p.src?.medium || p.src?.large,
        link: p.url,
        credit: `${p.photographer} / Pexels`
      }));
    }
    const res = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&per_page=8&orientation=landscape&content_filter=high`, {
      headers: { Authorization: `Client-ID ${imageKey.value.trim()}`, 'Accept-Version': 'v1' }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.errors?.join(', ') || 'Unsplash 이미지 로드 실패');
    return (data.results || []).map(p => ({
      src: p.urls?.small,
      link: p.links?.html,
      credit: `${p.user?.name || 'Creator'} / Unsplash`
    }));
  } catch (err) {
    setStatus(`분석은 완료됐지만 이미지 API 호출은 실패했습니다: ${err.message}`, true);
    return [];
  }
}

function render(d) {
  $('empty').style.display = 'none';
  $('result').classList.add('show');
  $('projectTitle').textContent = d.project.title;
  $('projectDesc').textContent = d.project.description;
  renderTags(d.project.tags);
  const unit = ['brochure', 'proposal', 'report', 'poster'].includes((d.project.assetType || '').toLowerCase()) ? '개 구성' : '화면';
  renderRows('screenTypes', d.screenTypes.map(s => [s.icon || '□', s.name || '구성 유형', `${s.count || 1}${unit}`]));
  renderRows('directionList', d.directions.map((x, i) => [`0${i + 1}`, x, '']));
  renderPalette(d.palette);
  renderMoods(d.moods);
  renderMoodBoard(d);
  renderReferences(d.references);
  renderImageSections(d);
}

function renderTags(tags) {
  $('tags').replaceChildren(...tags.map(t => el('span', 'tag', t)));
}

function renderRows(id, rows) {
  $(id).replaceChildren(...rows.map(([a, b, c]) => {
    const row = el('div', 'row');
    row.append(el('strong', '', a), document.createTextNode(b), el('span', '', c));
    return row;
  }));
}

function renderPalette(colors) {
  $('palette').replaceChildren(...colors.map(c => {
    const sw = el('div', 'swatch');
    sw.style.background = c.hex || '#333';
    sw.append(el('small', '', c.hex || ''));
    return sw;
  }));
  renderRows('paletteList', colors.map(c => ['', `${c.name || 'Color'} · ${c.role || 'Role'}`, c.hex || '']));
}

function renderMoods(moods) {
  $('moods').replaceChildren(...moods.slice(0, 3).map((m, i) => {
    const card = el('div', `card mood-card${i === state.selectedMoodIndex ? ' selected' : ''}`);
    const dots = el('div', 'dots');
    (m.colors || []).forEach(color => {
      const dot = el('div', 'dot');
      dot.style.background = color;
      dots.append(dot);
    });
    const select = el('button', 'btn', i === state.selectedMoodIndex ? '선택됨' : '이 무드 선택');
    select.addEventListener('click', () => selectMood(i));
    card.append(el('div', 'label', 'Mood'), el('h3', '', m.title || 'Mood'), el('p', '', m.desc || ''), dots, select);
    return card;
  }));
}

async function selectMood(index) {
  if (!state.result) return;
  state.selectedMoodIndex = index;
  state.result.selectedMood = getSelectedMood(state.result);
  if (canLoadMoodImages(state.result)) {
    setStatus('선택한 무드에 맞는 이미지를 다시 불러오는 중입니다.');
    state.result.moodImages = await loadMoodImages(getSelectedMoodImageKeywords(state.result));
  }
  render(state.result);
  setStatus('선택한 무드를 반영했습니다.');
}

function renderMoodBoard(d) {
  const mood = getSelectedMood(d);
  if (!mood) {
    $('moodBoard').replaceChildren(el('p', 'hint', '선택할 무드가 없습니다.'));
    return;
  }
  const dots = el('div', 'dots');
  (mood.colors || []).forEach(color => {
    const dot = el('div', 'dot');
    dot.style.background = color;
    dots.append(dot);
  });
  const keywords = [...(mood.keywords || []), ...(d.referenceKeywords || [])].slice(0, 6).join(', ');
  $('moodBoard').replaceChildren(
    el('h3', '', mood.title || 'Selected Mood'),
    el('p', '', mood.desc || ''),
    dots,
    buildArtifactBoard(d, mood),
    el('p', '', `팔레트 연관성: 전체 컬러 팔레트 중 이 무드에 맞는 핵심 색상을 조합해 레퍼런스 검색과 보드 방향에 사용합니다.`),
    el('p', '', `적용 키워드: ${keywords}`)
  );
}

function buildArtifactBoard(d, mood) {
  const board = el('div', 'artifact-board');
  board.append(buildArtifactPreview(d, mood), buildArtifactNotes(d, mood));
  return board;
}

function buildArtifactPreview(d, mood) {
  const colors = getMoodColors(mood);
  const purpose = getPurposeValue(d);
  const assetType = (d.project?.assetType || '').toLowerCase();
  if (purpose === 'image-reference' && assetType.includes('login')) return buildLoginPreview(d, colors);
  if (purpose === 'image-reference' || isDocumentAsset(assetType)) return buildBrochurePreview(d, colors);
  return buildScreenPreview(d, colors);
}

function getMoodColors(mood) {
  const colors = mood?.colors || [];
  return {
    bg: colors[0] || '#0f172a',
    primary: colors[1] || '#3b82f6',
    accent: colors[2] || '#10b981',
    surface: colors[3] || '#1f2937',
    warning: colors[4] || '#f59e0b'
  };
}

function buildLoginPreview(d, c) {
  const wrap = el('div', 'artifact-preview login-preview');
  const hero = el('div', 'login-hero');
  hero.style.background = `linear-gradient(135deg, ${c.bg}, ${c.primary})`;
  hero.style.color = c.accent;
  hero.append(
    el('h4', '', d.project.title || 'Service Login'),
    el('p', '', '선택한 무드의 배경색, 포인트 컬러, 보조색으로 로그인 히어로 영역과 인증 폼의 첫인상을 시뮬레이션합니다.')
  );
  const form = el('div', 'login-form');
  const button = el('div', 'form-button');
  button.style.background = c.primary;
  form.append(el('b', '', 'Welcome back'), el('div', 'form-line'), el('div', 'form-line'), button);
  wrap.append(hero, form);
  return wrap;
}

function buildScreenPreview(d, c) {
  const wrap = el('div', 'artifact-preview screen-preview');
  wrap.style.background = c.bg;
  wrap.style.color = c.accent;
  const top = el('div', 'screen-top');
  top.append(el('h4', '', d.project.title || 'Dashboard'), el('div', 'screen-pill'), el('div', 'screen-pill'));
  const grid = el('div', 'screen-grid');
  const map = el('div', 'screen-map');
  map.style.color = c.accent;
  const stack = el('div', 'screen-stack');
  const panel1 = el('div', 'screen-panel');
  panel1.style.background = c.primary;
  const panel2 = el('div', 'screen-panel');
  panel2.style.background = c.surface;
  stack.append(panel1, panel2);
  const table = el('div', 'screen-table');
  table.style.background = `linear-gradient(90deg, ${c.surface}, rgba(255,255,255,.10))`;
  grid.append(map, stack, table);
  wrap.append(top, grid);
  return wrap;
}

function buildBrochurePreview(d, c) {
  const wrap = el('div', 'artifact-preview brochure-preview');
  const cover = el('div', 'brochure-cover');
  cover.style.background = `linear-gradient(145deg, ${c.bg}, ${c.primary})`;
  cover.append(el('h4', '', d.project.title || 'Brand Document'), el('p', '', '표지 이미지와 내지 정보 구조를 선택 무드 색상으로 시뮬레이션합니다.'));
  const spread = el('div', 'brochure-spread');
  const accent = el('div', 'mini-block');
  accent.style.background = c.accent;
  const grid = el('div', 'mini-grid');
  grid.append(accent, el('div', 'mini-block'), el('div', 'mini-block'));
  spread.append(el('b', '', 'Content Spread'), el('div', 'copy-line'), el('div', 'copy-line short'), grid, el('div', 'copy-line'), el('div', 'copy-line short'));
  wrap.append(cover, spread);
  return wrap;
}

function buildArtifactNotes(d, mood) {
  const notes = el('div', 'artifact-notes');
  const purpose = getPurposeValue(d);
  const assetType = (d.project?.assetType || '').toLowerCase();
  const purposeText = {
    'ui-reference': '화면 구조, 컴포넌트, 콘텐츠 밀도에 무드 색상이 어떻게 적용되는지 확인합니다.',
    'image-reference': isDocumentAsset(assetType)
      ? '브로셔/문서 표지와 내지에서 이미지 톤, 배경색, 포인트 컬러가 어떻게 보이는지 확인합니다.'
      : '웹페이지, 로그인, 히어로 영역에 들어갈 이미지 톤을 확인합니다.'
  }[purpose] || '선택한 산출물 유형에 무드 색상이 어떻게 적용되는지 확인합니다.';
  notes.append(
    el('div', 'artifact-note', purposeText),
    el('div', 'artifact-note', `선택 무드: ${mood.title || 'Mood'}`),
    el('div', 'artifact-note', `이 보드는 스톡 사진이 아니라 설계문서의 산출물 유형과 컬러 무드를 조합한 구조 미리보기입니다.`)
  );
  return notes;
}

function renderReferences(groups) {
  $('references').replaceChildren(...groups.map(g => {
    const box = el('div', 'ref-group');
    const links = el('div', 'ref-links');
    g.items.forEach(item => {
      const a = el('a', '', item.label);
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      links.append(a);
    });
    const head = el('div', 'ref-head', g.note ? `${g.name} · ${g.note}` : g.name);
    box.append(head, links);
    return box;
  }));
}

function renderImageSections(d) {
  const showImages = shouldUseMoodImages(d);
  $('imagesCard').style.display = showImages ? 'block' : 'none';
  $('promptsCard').style.display = showImages && (d.imagePrompts || []).length ? 'block' : 'none';
  if (!showImages) {
    $('images').replaceChildren();
    $('prompts').replaceChildren();
    return;
  }
  renderImages(d.moodImages || []);
  renderPrompts(d.imagePrompts || []);
}

function renderImages(images) {
  const target = $('images');
  if (!imageKey.value.trim()) {
    target.replaceChildren(el('p', 'hint', `${imageProvider.value === 'pexels' ? 'Pexels' : 'Unsplash'} API key를 입력하면 보조 이미지 후보가 표시됩니다. 산출물의 실제 무드보드는 위의 선택 무드 기반 보드를 기준으로 확인하세요.`));
    return;
  }
  if (!images.length) {
    target.replaceChildren(el('p', 'hint', '선택한 무드에 맞는 이미지를 찾지 못했습니다. 키워드를 조정하거나 다른 무드를 선택하세요.'));
    return;
  }
  target.replaceChildren(...images.map(img => {
    const tile = el('div', 'image-tile');
    const image = document.createElement('img');
    image.src = img.src;
    image.alt = img.credit;
    const link = el('a', '', img.credit);
    link.href = img.link;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    tile.append(image, link);
    return tile;
  }));
}

function renderPrompts(prompts) {
  $('prompts').replaceChildren(...prompts.map(p => {
    const item = el('div', 'prompt-item');
    const copy = el('button', '', '복사');
    copy.addEventListener('click', () => navigator.clipboard.writeText(p).then(() => {
      copy.textContent = '복사됨';
      setTimeout(() => copy.textContent = '복사', 1200);
    }));
    item.append(el('div', '', p), copy);
    return item;
  }));
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

function exportMarkdown() {
  if (!state.result) return;
  const d = state.result;
  const mood = getSelectedMood(d);
  const lines = [
    `# ${d.project.title || 'Design Reference'}`,
    '',
    d.project.description || '',
    '',
    '## 1. 레퍼런스 목적',
    `- 목적: ${d.referencePurpose?.label || ''}`,
    `- 판단 이유: ${d.referencePurpose?.reason || ''}`,
    `- 테마 제안: ${getThemeLabel(d.themeRecommendation?.preferred || '')}`,
    `- 테마 이유: ${d.themeRecommendation?.reason || ''}`,
    '',
    '## 2. 필요 산출물 구성',
    ...(d.screenTypes || []).map(item => `- ${item.name || ''}: ${item.desc || ''}`),
    '',
    '## 3. 디자인 판단 기준',
    ...(d.directions || []).map(item => `- ${item}`),
    '',
    '## 4. 컬러 팔레트',
    ...(d.palette || []).map(item => `- ${item.name || 'Color'} (${item.hex || ''}): ${item.role || ''}`),
    '',
    '## 5. 무드보드 방향',
    ...(d.moods || []).map(item => `- ${item.title || 'Mood'}: ${item.desc || ''}`),
    '',
    '## 6. 선택 무드 기반 보드',
    `- 선택 무드: ${mood?.title || ''}`,
    `- 설명: ${mood?.desc || ''}`,
    `- 사용 색상: ${(mood?.colors || []).join(', ')}`,
    `- 적용 키워드: ${[...(mood?.keywords || []), ...(d.referenceKeywords || [])].slice(0, 6).join(', ')}`,
    `- 보드 기준: 설계문서의 산출물 유형과 선택한 컬러 무드를 조합해 화면/문서 구조 미리보기를 구성`,
    '',
    '## 7. 플랫폼별 검색어',
    ...Object.entries(d.platformKeywords || {}).flatMap(([platform, keywords]) => [`### ${platform}`, ...(keywords || []).map(k => `- ${k}`)]),
  ];
  if (shouldUseMoodImages(d) && (d.imagePrompts || []).length) {
    lines.push('', '## 8. 이미지 생성 프롬프트', ...(d.imagePrompts || []).map(item => `- ${item}`));
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
  downloadBlob(blob, `${d.project.title || 'design-reference'}-moodboard.md`);
}

function exportJson() {
  if (!state.result) return;
  state.result.selectedMood = getSelectedMood(state.result);
  const blob = new Blob([JSON.stringify(state.result, null, 2)], { type: 'application/json' });
  downloadBlob(blob, `${state.result.project.title || 'design-reference'}-moodboard.json`);
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function reset() {
  state.fileText = '';
  state.fileBase64 = '';
  state.fileType = '';
  state.result = null;
  state.selectedMoodIndex = 0;
  $('fileName').textContent = '';
  $('pasteText').value = '';
  $('result').classList.remove('show');
  $('empty').style.display = 'grid';
  statusBox.className = 'status';
}
